root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  # Commands to run before compiling Go: generate Templ & build Tailwind
  pre_cmd = ["templ generate", "npx tailwindcss -i ./static/css/input.css -o ./static/css/output.css"]

  # Command to compile your Go binary
  cmd = "go build -o ./tmp/main ./cmd/server/main.go"

  # Binary to execute
  bin = "./tmp/main"

  # Watch these extensions for changes
  include_ext = ["go", "tpl", "tmpl", "templ", "html", "sql"]

  # Exclude non-source folders
  exclude_dir = ["assets", "tmp", "vendor", "node_modules", "static"]

  # Delay before rebuild to let file writes settle
  delay = 1000 # ms

[log]
  time = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
