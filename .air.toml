root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  # Pre-compilation generators
  pre_cmd = ["sqlc generate", "templ generate"]

  # Command to compile your Go binary
  cmd = "go build -o ./tmp/main ./cmd/server/main.go"

  # Binary to execute
  bin = "./tmp/main"

  # Watch these extensions for changes
  include_ext = ["go", "tpl", "tmpl", "templ", "html", "sql"]

  # Exclude directories where generated files or static assets live
  exclude_dir = ["assets", "tmp", "vendor", "node_modules", "static", "internal/db"]

  # Ignore all auto-generated templ files to prevent loop triggers
  exclude_regex = [".*_templ.go"]

  # Delay before rebuild to let file writes settle
  delay = 1000 # ms

[log]
  time = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
